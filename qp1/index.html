
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Fill in your details to register</p>

        <form id="registrationForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <span class="error" id="nameError"></span>

            <label for="roll">Roll Number</label>
            <input type="text" id="roll" placeholder="Enter your roll number">
            <span class="error" id="rollError"></span>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <label for="course">Select Course</label>
            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="CSE">Computer Science Engineering</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics and Communication</option>
                <option value="EEE">Electrical and Electronics</option>
                <option value="MECH">Mechanical Engineering</option>
            </select>
            <span class="error" id="courseError"></span>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Create a strong password">
            <span class="error" id="passwordError"></span>

            <label for="file">Upload Student Document</label>
            <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png">
            <span class="error" id="fileError"></span>

            <button type="submit">Register Now</button>
            <p id="successMessage"></p>
        </form>
    </div>

    <script src="validation.js"></script>
</body>
</html>
